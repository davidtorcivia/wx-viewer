          path: |
            continuity-results/baseline/continuity/font-1.0/continuity-temperature.mp4
            continuity-results/baseline/continuity/font-1.0/continuity-temperature.capture.json
            continuity-results/baseline/continuity/font-1.0/continuity-temperature-before.png
            continuity-results/baseline/continuity/font-1.0/continuity-temperature-after.png
            continuity-results/baseline/continuity/font-1.0/continuity-temperature-failure.png
            continuity-results/baseline/continuity/font-1.0/continuity-temperature-failure.xml
            continuity-results/baseline/continuity/font-1.0/continuity-temperature-screenrecord.log
