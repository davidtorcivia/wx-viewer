          compression-level: 0
          path: |
            app/build/outputs/radar-layers-preview/continuity/font-1.0/continuity-dew-point.mp4
            app/build/outputs/radar-layers-preview/continuity/font-1.0/continuity-dew-point.capture.json
            app/build/outputs/radar-layers-preview/continuity/font-1.0/continuity-dew-point-before.png
            app/build/outputs/radar-layers-preview/continuity/font-1.0/continuity-dew-point-after.png
