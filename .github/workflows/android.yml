            app/build/outputs/radar-layers-preview/continuity/font-2.0/continuity-temperature-launch.sh
            app/build/outputs/radar-layers-preview/continuity/font-2.0/continuity-temperature-probe.sh
            app/build/outputs/radar-layers-preview/continuity/font-2.0/continuity-temperature-stop.sh
            app/build/outputs/radar-layers-preview/continuity/font-2.0/instrumentation.log
            app/build/outputs/radar-layers-preview/continuity/font-2.0/continuity-capture-proof.json
            app/build/outputs/radar-layers-preview/continuity/continuity-analysis.json
            app/build/outputs/radar-layers-preview/continuity/continuity-status.txt
            app/build/outputs/radar-layers-preview/continuity/continuity-analysis-frames/temperature-2x-*/**
          if-no-files-found: error
      - name: Save Dew point normal-text native video
        if: always() && matrix.lane == 'layers-1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
