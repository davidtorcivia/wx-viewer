name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Stop obsolete commits from consuming runners while newer feedback is waiting.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1, Node 24
        with:
          distribution: temurin
          # AGP 8.10's supported/default JDK; setup-java's version is independent.
          java-version: '17'
      # GitHub-only cache. Each source commit can contribute new Gradle task
      # outputs instead of forever restoring the first build-file-keyed snapshot.
      - name: Restore latest compatible Gradle build state
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: wx-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/*.toml') }}-${{ github.sha }}
          restore-keys: |
            wx-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'gradle/*.toml') }}-
            wx-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0, Node 24
        with:
          cache-provider: external
      - name: Validate CI harness contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Build all packages once and lint
        # These runners have no emulator competing for memory during compilation.
        # All device jobs consume these same signed bytes, without another Gradle build.
        run: >-
          bash ./gradlew --build-cache --parallel --max-workers=4
          '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8'
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview
          :macrobenchmark:assembleBenchmark :app:lintDebug
      - name: Verify preview and record exact package hashes
        run: |
          bash scripts/verify-preview-apk.sh app/build/outputs/apk/preview/app-preview.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            app/build/outputs/apk/preview/app-preview.apk \
            macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk > apk-sha256.txt
      - name: Stop Gradle before archiving its build state
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: bash ./gradlew --stop
      - name: Save successful source-specific Gradle build state
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Share the exact packages with every device lane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-validation-packages
          compression-level: 0
          path: |
            apk-sha256.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/preview/app-preview.apk
            macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk
          if-no-files-found: error
      - name: Save debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wx-viewer-debug
          compression-level: 6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Save CI-only release-like build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # User delivery uses the locally signed preview; never deliver the CI key.
          name: wx-viewer-release-like-ci-key
          compression-level: 6
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/preview/
          if-no-files-found: ignore

  android-device:
    name: Device / ${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [debug, playback, layers-0, layers-1, layers-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Download prebuilt packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-validation-packages
      - name: Verify these are the same build's exact APKs
        run: sha256sum --check apk-sha256.txt
      - name: Enable temporary runner KVM access
        shell: bash
        run: |
          test -c /dev/kvm || { echo "This runner has no KVM device"; exit 1; }
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            command -v getfacl >/dev/null
            command -v setfacl >/dev/null
            getfacl --absolute-names /dev/kvm > "$RUNNER_TEMP/wx-kvm-original.acl"
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run required device lane
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0, Node 24
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          # Preserve cold starts and Mesa graphics. SwiftShader loses MapLibre symbols.
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on -no-metrics
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/ci/run-device-lane.sh ${{ matrix.lane }}
      - name: Restore runner KVM permissions
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/wx-kvm-original.acl" ]]; then
            sudo setfacl --restore="$RUNNER_TEMP/wx-kvm-original.acl"
          fi
      - name: Save small machine-checkable coverage proofs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-proof-${{ matrix.lane }}
          path: ci-proof/
          if-no-files-found: error
      - name: Save device logs and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-e2e-reports-${{ matrix.lane }}
          path: |
            app/build/outputs/e2e/
            app/build/outputs/connected_android_test_additional_output/
            !app/build/outputs/connected_android_test_additional_output/**/beauty-*
            !app/build/outputs/e2e/device-beauty/**
          if-no-files-found: ignore
      - name: Save screen beauty captures
        if: always() && matrix.lane == 'debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-screen-beauty
          path: app/build/outputs/connected_android_test_additional_output/**/beauty-*
          if-no-files-found: ignore
      - name: Save real-device large-text captures
        if: always() && matrix.lane == 'debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-beauty
          path: |
            app/build/outputs/e2e/device-beauty/
            !app/build/outputs/e2e/device-beauty/screenshots.tar
          if-no-files-found: ignore
      - name: Save minified offline and process-death evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-offline-preview-evidence-${{ matrix.lane }}
          path: |
            app/build/outputs/offline-preview/
            app/build/outputs/radar-offline-phases/
            app/build/outputs/radar-layers-preview/offline-*/
          if-no-files-found: ignore
      - name: Save live radar layer evidence
        if: always() && startsWith(matrix.lane, 'layers-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-radar-live-evidence-${{ matrix.lane }}
          path: |
            app/build/outputs/radar-layers-preview/
            !app/build/outputs/radar-layers-preview/offline-*/**
            !app/build/outputs/radar-layers-preview/playback-*/**
            !app/build/outputs/radar-layers-preview/**/*.mp4
          if-no-files-found: ignore
      - name: Save normal-text sequential native radar videos
        if: always() && startsWith(matrix.lane, 'layers-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-radar-video-normal-${{ matrix.lane }}
          compression-level: 0
          path: app/build/outputs/radar-layers-preview/continuity/font-1.0/*.mp4
          if-no-files-found: error
      - name: Save large-text sequential native radar videos
        if: always() && startsWith(matrix.lane, 'layers-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-radar-video-large-${{ matrix.lane }}
          compression-level: 0
          path: app/build/outputs/radar-layers-preview/continuity/font-2.0/*.mp4
          if-no-files-found: error
      - name: Save sustained radar playback evidence
        if: always() && matrix.lane == 'playback'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-radar-playback-evidence
          path: app/build/outputs/radar-layers-preview/playback-*/
          if-no-files-found: ignore

  android-e2e:
    name: android-e2e
    if: always()
    needs: [build, android-device]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and device lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.android-device.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-proof-*
          path: ci-results
      - name: Require complete Android suite, 28 live and 56 offline cases
        shell: bash
        run: python3 scripts/ci/verify-coverage.py ci-results | tee -a "$GITHUB_STEP_SUMMARY"
