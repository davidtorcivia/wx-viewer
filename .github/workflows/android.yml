  android-e2e:
    name: android-e2e
    if: always()
    needs: [build, android-device]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and device lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.android-device.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-proof-*
          path: ci-results
